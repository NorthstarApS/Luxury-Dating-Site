kind = "web"
previewPath = "/"
title = "SofiaDating"
description = "SofiaDating — Færre. Bedre. Kurateret dating fra Datez Network. Eksklusiv betyder kvalitet, ikke formue."
version = "1.0.0"
id = "artifacts/velour-dating"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18967

[services.development]
run = "pnpm --filter @workspace/velour-dating run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/velour-dating", "run", "build" ]
serve = "static"
publicDir = "artifacts/velour-dating/dist/public"

[[services.production.rewrites]]
from = "/soulmate"
to = "/soulmate/index.html"

[[services.production.rewrites]]
from = "/dating-med-omtanke"
to = "/dating-med-omtanke/index.html"

[[services.production.rewrites]]
from = "/find-den-rigtige"
to = "/find-den-rigtige/index.html"

[[services.production.rewrites]]
from = "/kvalitet-frem-for-kvantitet"
to = "/kvalitet-frem-for-kvantitet/index.html"

[[services.production.rewrites]]
from = "/rolig-dating"
to = "/rolig-dating/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18967"
BASE_PATH = "/"
